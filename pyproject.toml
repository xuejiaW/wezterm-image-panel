[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wezterm-image-panel"
dynamic = ["version"]
description = "Browse images from a local Codex CLI session in a WezTerm pane"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["codex", "wezterm", "terminal", "images"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.scripts]
wezterm-image-panel = "wezterm_image_panel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "wezterm_image_panel.__version__"}

[tool.setuptools.package-data]
wezterm_image_panel = ["assets/*.lua"]

[tool.setuptools.data-files]
"share/wezterm-image-panel" = ["integrations/wezterm.lua"]
